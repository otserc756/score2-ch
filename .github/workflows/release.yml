# Quando si crea un tag di versione (es. v0.9.0) prepara lo zip da scaricare
# per l'installazione da cartella locale e lo allega a una release di GitHub.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test tests/*.test.js
      - name: Note di versione da CHANGELOG.md (controlla anche che il tag coincida con src/version.js)
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Prepara lo zip
        run: |
          bash scripts/build-site.sh "dist/score2-ch" "$GITHUB_REF_NAME"
          cd dist && zip -r -q "score2-ch-${GITHUB_REF_NAME}.zip" score2-ch
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le versioni 0.x e quelle con un suffisso (es. v1.0.0-rc1) escono come pre-release
          PRE=""
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "dist/score2-ch-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md $PRE
